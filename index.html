<body>

  </main>
  <script>
  (()=>{
    const shell=document.getElementById('aquarium'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint'),hintText=document.getElementById('hintText'),soundBtn=document.getElementById('sound'),soundText=document.getElementById('soundText'),languageBtn=document.getElementById('languageToggle'),titleText=document.getElementById('titleText'),subtitleText=document.getElementById('subtitleText'),note=document.getElementById('note'),noteTitle=document.getElementById('noteTitle'),noteItems=document.getElementById('noteItems');
    const translations={'zh-TW':{title:'潮境',subtitle:'台灣互動水族箱',noteLabel:'水族箱內的台灣海洋元素',noteTitle:'台灣・海洋選集',noteItems:'蘭嶼飛魚　潮境水母　墾丁珊瑚　澎湖玄武岩',idle:'動動游標或手指試看看，別忘了有聲音！',active:'魚群正在跟著你游，別忘了有聲音！',off:'關閉聲音',on:'開啟聲音',offLabel:'關閉海底聲音',onLabel:'開啟海底聲音'},en:{title:'TIDESCAPE',subtitle:'TAIWAN INTERACTIVE AQUARIUM',noteLabel:'Taiwan marine life and landscapes in the aquarium',noteTitle:'TAIWAN · OCEAN COLLECTION',noteItems:'Orchid Island flying fish · Tidescape jellyfish · Kenting coral · Penghu basalt',idle:'Move your cursor or finger and see what happens—don’t forget the sound!',active:'The fish are following you—don’t forget the sound!',off:'SOUND OFF',on:'SOUND ON',offLabel:'Turn off underwater sound',onLabel:'Turn on underwater sound'}};
    let language=localStorage.getItem('tidescape-locale');if(language!=='zh-TW'&&language!=='en')language=/^zh(?:-Hant)?-TW$/i.test(navigator.languages?.[0]||navigator.language||'')?'zh-TW':'en';let words=translations[language];
    function applyLanguage(){words=translations[language];document.documentElement.lang=language==='zh-TW'?'zh-Hant-TW':'en';titleText.textContent=words.title;titleText.classList.toggle('en',language==='en');subtitleText.textContent=words.subtitle;note.setAttribute('aria-label',words.noteLabel);noteTitle.textContent=words.noteTitle;noteItems.textContent=words.noteItems;hintText.textContent=pointer?.active?words.active:words.idle;soundBtn.setAttribute('aria-label',soundWanted?words.offLabel:words.onLabel);soundText.textContent=soundWanted?words.off:words.on;languageBtn.setAttribute('aria-label',language==='zh-TW'?'切換為英文介面':'Switch to Traditional Chinese');languageBtn.querySelectorAll('[data-locale]').forEach(el=>el.classList.toggle('active',el.dataset.locale===language))}
    const palette=[['#f6c453','#142e43'],['#55d4c6','#e8fff9'],['#f17f62','#ffe0a8'],['#91d5ef','#274f73'],['#e9e3bd','#1c2947']];
    const fish=[],jellies=[],bubbles=[];let width=1,height=1,last=performance.now(),audio=null,bubbleTimer=null,soundWanted=true;const pointer={x:0,y:0,active:false};applyLanguage();
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=v=>{const t=clamp(v,0,1);return t*t*(3-2*t)};
    function resize(){const b=shell.getBoundingClientRect(),nw=Math.max(1,Math.round(b.width)),nh=Math.max(1,Math.round(b.height));if(nw===width&&nh===height)return;const ox=width,oy=height,sx=nw/ox,sy=nh/oy,dpr=Math.min(devicePixelRatio||1,2);width=nw;height=nh;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(ox>1&&oy>1){fish.forEach(f=>{f.x=clamp(f.x*sx,f.s,width-f.s);f.y=clamp(f.y*sy,f.s,height-f.s)});jellies.forEach(j=>{j.x=clamp(j.x*sx,j.s,width-j.s);j.y*=sy});bubbles.forEach(b=>{b.x*=sx;b.y*=sy});if(pointer.active){pointer.x*=sx;pointer.y*=sy}}const fc=clamp(Math.round(width*height/24000),26,58);while(fish.length<fc){const i=fish.length,c=palette[i%palette.length];fish.push({x:Math.random()*width,y:height*(.2+Math.random()*.55),vx:(Math.random()-.5)*1.4||.5,vy:(Math.random()-.5)*.45,s:10+Math.random()*(width<600?11:18),c:c[0],a:c[1],sp:i%5,p:Math.random()*Math.PI*2})}fish.length=fc;const jc=clamp(Math.round(width*height/145000),5,9);while(jellies.length<jc){const d=.45+Math.random()*.55;jellies.push({x:width*(.1+Math.random()*.8),y:height*(.72+Math.random()*.62),vx:(Math.random()-.5)*.16,vy:-.09-Math.random()*.13,s:(width<600?18:24)+Math.random()*(width<600?16:26),p:Math.random()*Math.PI*2,d,h:182+Math.random()*68})}jellies.length=jc}
    function drawFish(f,t){const speed=Math.hypot(f.vx,f.vy),angle=Math.atan2(f.vy,f.vx),flip=Math.cos(angle)<0?-1:1,tail=Math.sin(t*.009+f.p)*(.16+speed*.06);ctx.save();ctx.translate(f.x,f.y);ctx.rotate(angle);ctx.scale(1,flip);ctx.globalAlpha=.18;ctx.fillStyle='#001522';ctx.beginPath();ctx.ellipse(-f.s*.08,f.s*.22,f.s*.76,f.s*.18,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.save();ctx.translate(-f.s*.82,0);ctx.rotate(tail);ctx.fillStyle=f.a;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-f.s*.62,-f.s*.5);ctx.quadraticCurveTo(-f.s*.42,0,-f.s*.64,f.s*.5);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle=f.c;ctx.beginPath();ctx.ellipse(0,0,f.s,f.s*(f.sp===1?.58:.48),0,0,Math.PI*2);ctx.fill();if(f.sp===0||f.sp===4){ctx.fillStyle=f.a;ctx.fillRect(-f.s*.15,-f.s*.46,f.s*.18,f.s*.92);ctx.fillRect(f.s*.32,-f.s*.39,f.s*.12,f.s*.78)}else if(f.sp===2){ctx.strokeStyle=f.a;ctx.lineWidth=f.s*.12;ctx.beginPath();ctx.arc(f.s*.08,0,f.s*.48,-1.2,1.2);ctx.stroke()}ctx.fillStyle=f.a;ctx.beginPath();ctx.moveTo(-f.s*.08,-f.s*.4);ctx.lineTo(f.s*.2,-f.s*.72);ctx.lineTo(f.s*.5,-f.s*.33);ctx.closePath();ctx.fill();ctx.fillStyle='#f8ffff';ctx.beginPath();ctx.arc(f.s*.57,-f.s*.11,f.s*.13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#071820';ctx.beginPath();ctx.arc(f.s*.61,-f.s*.11,f.s*.064,0,Math.PI*2);ctx.fill();ctx.restore()}
    function drawJelly(j,t,life){const pulse=Math.sin(t*.0032+j.p),bw=j.s*(1+pulse*.06),bh=j.s*(.68-pulse*.035),sway=Math.sin(t*.0018+j.p)*j.s*.12;ctx.save();ctx.translate(j.x,j.y);ctx.globalAlpha=(.38+j.d*.28)*life;ctx.shadowColor=`hsla(${j.h},90%,82%,.55)`;ctx.shadowBlur=j.s*.55;const g=ctx.createRadialGradient(0,-bh*.15,0,0,0,bw);g.addColorStop(0,`hsla(${j.h},95%,92%,.78)`);g.addColorStop(.55,`hsla(${j.h+15},78%,76%,.38)`);g.addColorStop(1,`hsla(${j.h+24},75%,68%,.04)`);ctx.fillStyle=g;ctx.strokeStyle=`hsla(${j.h},90%,91%,.62)`;ctx.lineWidth=Math.max(1,j.s*.025);ctx.beginPath();ctx.moveTo(-bw,0);ctx.bezierCurveTo(-bw*.88,-bh,bw*.88,-bh,bw,0);ctx.quadraticCurveTo(bw*.72,bh*.18,bw*.48,0);ctx.quadraticCurveTo(bw*.24,bh*.25,0,0);ctx.quadraticCurveTo(-bw*.24,bh*.25,-bw*.48,0);ctx.quadraticCurveTo(-bw*.72,bh*.18,-bw,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=j.s*.2;ctx.lineCap='round';for(let i=-2;i<=2;i++){const x=i*bw*.31,len=j.s*(1.15+(2-Math.abs(i))*.18);ctx.strokeStyle=`hsla(${j.h+i*7},88%,88%,${.42+j.d*.2})`;ctx.lineWidth=Math.max(.8,j.s*(i===0?.035:.024));ctx.beginPath();ctx.moveTo(x,bh*.06);ctx.bezierCurveTo(x+sway*(i%2?-.75:.55),len*.3,x-sway+i*2,len*.72,x+sway*.6,len);ctx.stroke()}ctx.restore()}
    function drawTaiwan(){const x=width*.76,y=height*.79,s=Math.min(width,height)*.17;ctx.save();ctx.translate(x,y);ctx.rotate(-.14);const g=ctx.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#66877c');g.addColorStop(.55,'#304e49');g.addColorStop(1,'#153335');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-s*.08,-s*1.05);ctx.bezierCurveTo(s*.22,-s*.75,s*.25,-s*.47,s*.42,-s*.2);ctx.bezierCurveTo(s*.28,s*.05,s*.42,s*.3,s*.14,s*.65);ctx.bezierCurveTo(-s*.03,s*.91,-s*.1,s*1.12,-s*.32,s*.95);ctx.bezierCurveTo(-s*.48,s*.63,-s*.36,s*.32,-s*.52,s*.02);ctx.bezierCurveTo(-s*.46,-s*.36,-s*.24,-s*.78,-s*.08,-s*1.05);ctx.fill();ctx.strokeStyle='rgba(190,231,195,.22)';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
    function setPointer(e){const b=shell.getBoundingClientRect();pointer.x=clamp(e.clientX-b.left,0,b.width);pointer.y=clamp(e.clientY-b.top,0,b.height);pointer.active=true;hint.classList.add('active');hintText.textContent=words.active}
    function addBubbles(){for(let i=0;i<7;i++)bubbles.push({x:pointer.x+(Math.random()-.5)*36,y:pointer.y+Math.random()*14,r:2+Math.random()*5,life:1,drift:(Math.random()-.5)*.8})}
    shell.addEventListener('pointermove',setPointer,{passive:true});shell.addEventListener('pointerdown',e=>{if(e.target.closest('#sound,#languageToggle'))return;setPointer(e);addBubbles()},{passive:true});shell.addEventListener('pointerleave',()=>{pointer.active=false;hint.classList.remove('active');hintText.textContent=words.idle});new ResizeObserver(resize).observe(shell);addEventListener('resize',resize);visualViewport?.addEventListener('resize',resize);
    function frame(t){const dt=Math.min((t-last)/16.67,2);last=t;ctx.clearRect(0,0,width,height);drawTaiwan();jellies.forEach(j=>{const pulse=(Math.sin(t*.0032+j.p)+1)*.5;let ax=Math.sin(t*.00055+j.p)*.0018,ay=-.001-pulse*.0022;if(pointer.active){const dx=j.x-pointer.x,dy=j.y-pointer.y,d=Math.hypot(dx,dy);if(d<155&&d>1){const a=(1-d/155)*.022;ax+=dx/d*a;ay+=dy/d*a}}if(j.x<j.s)ax+=.004;if(j.x>width-j.s)ax-=.004;const ext=j.s*2.35,fin= smooth((height+ext-j.y)/(height+ext-height*.74)),fout=smooth((j.y+ext)/(height*.28+ext)),life=Math.min(fin,fout);if(j.y<-ext-j.s*.25){j.x=width*(.08+Math.random()*.84);j.y=height+ext+Math.random()*height*.34;j.vx=(Math.random()-.5)*.12;j.vy=-.08-Math.random()*.1;j.p=Math.random()*Math.PI*2;j.h=182+Math.random()*68}if(j.y>height*.79)ay-=.006;j.vx=clamp((j.vx+ax*dt)*.995,-.48,.48);j.vy=clamp((j.vy+ay*dt)*.997,-.42,.22);j.x+=j.vx*dt;j.y+=j.vy*dt;drawJelly(j,t,life)});for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=1.2*dt;b.x+=b.drift*dt;b.life-=.008*dt;ctx.strokeStyle=`rgba(209,246,255,${b.life*.58})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();if(b.life<=0||b.y<0)bubbles.splice(i,1)}fish.forEach((f,i)=>{let ax=Math.sin(t*.00035+f.p)*.006,ay=Math.cos(t*.00047+f.p)*.007;if(pointer.active){const dx=pointer.x-f.x,dy=pointer.y-f.y,d=Math.max(Math.hypot(dx,dy),48),a=clamp(d/560,.28,1);ax+=dx/d*a*.12;ay+=dy/d*a*.12}fish.forEach((o,k)=>{if(i===k)return;const dx=f.x-o.x,dy=f.y-o.y,d=dx*dx+dy*dy;if(d<2600&&d>1){ax+=dx/d*.42;ay+=dy/d*.42}});if(f.x<55)ax+=.025;if(f.x>width-55)ax-=.025;if(f.y<95)ay+=.025;if(f.y>height*.78)ay-=.03;f.vx=(f.vx+ax*dt)*.988;f.vy=(f.vy+ay*dt)*.988;let s=Math.hypot(f.vx,f.vy),max=pointer.active?4.8:1.5;if(s>max){f.vx=f.vx/s*max;f.vy=f.vy/s*max}else if(s<.5){f.vx=f.vx/(s||1)*.5;f.vy=f.vy/(s||1)*.5}f.x+=f.vx*dt;f.y+=f.vy*dt;drawFish(f,t)});requestAnimationFrame(frame)}
    function stopSound(){soundWanted=false;if(bubbleTimer)clearTimeout(bubbleTimer);bubbleTimer=null;if(audio){const {context,master}=audio;master.gain.cancelScheduledValues(context.currentTime);master.gain.setValueAtTime(Math.max(master.gain.value,.0001),context.currentTime);master.gain.exponentialRampToValueAtTime(.0001,context.currentTime+.45);setTimeout(()=>context.close(),520)}audio=null;soundBtn.classList.remove('active');soundBtn.setAttribute('aria-pressed','false');soundBtn.setAttribute('aria-label',words.onLabel);soundText.textContent=words.on}
    async function startSound(){soundWanted=true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(audio){if(audio.context.state==='suspended')await audio.context.resume();return}const context=new AC();await context.resume();const master=context.createGain();master.gain.setValueAtTime(.0001,context.currentTime);master.gain.exponentialRampToValueAtTime(.28,context.currentTime+1.3);master.connect(context.destination);const buffer=context.createBuffer(1,context.sampleRate*4,context.sampleRate),ch=buffer.getChannelData(0);let brown=0;for(let i=0;i<ch.length;i++){brown=(brown+(Math.random()*2-1)*.035)/1.035;ch[i]=brown*3.2}const current=context.createBufferSource();current.buffer=buffer;current.loop=true;const filter=context.createBiquadFilter();filter.type='lowpass';filter.frequency.value=520;const gain=context.createGain();gain.gain.value=.38;current.connect(filter).connect(gain).connect(master);current.start();const tone=context.createOscillator(),tg=context.createGain();tone.frequency.value=54;tg.gain.value=.055;tone.connect(tg).connect(master);tone.start();audio={context,master};const bubble=()=>{if(!audio||audio.context!==context)return;const now=context.currentTime,o=context.createOscillator(),g=context.createGain(),f=240+Math.random()*300;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*1.65,now+.13);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.04,now+.018);g.gain.exponentialRampToValueAtTime(.0001,now+.16);o.connect(g).connect(master);o.start(now);o.stop(now+.18);bubbleTimer=setTimeout(bubble,1500+Math.random()*4200)};bubbleTimer=setTimeout(bubble,700+Math.random()*1200);soundBtn.classList.add('active');soundBtn.setAttribute('aria-pressed','true');soundBtn.setAttribute('aria-label',words.offLabel);soundText.textContent=words.off}
    const unlock=()=>{if(soundWanted)startSound().catch(()=>{})};languageBtn.addEventListener('pointerdown',e=>e.stopPropagation());languageBtn.addEventListener('click',()=>{language=language==='zh-TW'?'en':'zh-TW';localStorage.setItem('tidescape-locale',language);applyLanguage()});soundBtn.addEventListener('pointerdown',e=>e.stopPropagation());soundBtn.addEventListener('click',()=>soundWanted?stopSound():startSound().catch(()=>{}));addEventListener('pointerdown',unlock,{capture:true});addEventListener('touchstart',unlock,{capture:true,passive:true});addEventListener('keydown',unlock,{capture:true});startSound().catch(()=>{});resize();requestAnimationFrame(frame);
  })();
